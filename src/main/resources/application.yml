spring:
  application:
    name: codearena-platform

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/codearena}
      database: codearena

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  cache:
    type: redis
    redis:
      time-to-live: 15000

jwt:
  secret: ${JWT_SECRET:change-this-secret-key-in-production-min-32-chars}
  expiration: ${JWT_EXPIRATION:86400000}

judge0:
  api-url: ${JUDGE0_API_URL:http://localhost:2358}
  api-key: ${JUDGE0_API_KEY:}
  timeout: ${JUDGE0_TIMEOUT:30000}
  poll-interval: ${JUDGE0_POLL_INTERVAL:500}

execution:
  backend: ${EXECUTION_BACKEND:judge0}
  fallback-to-local: ${EXECUTION_FALLBACK_TO_LOCAL:true}
  local:
    timeout-ms: ${EXECUTION_LOCAL_TIMEOUT_MS:30000}
    max-output-bytes: ${EXECUTION_LOCAL_MAX_OUTPUT_BYTES:200000}
    java:
      xmx-mb: ${EXECUTION_LOCAL_JAVA_XMX_MB:256}

rate-limit:
  run:
    max-requests: 10
    window-seconds: 60
  submit:
    max-requests: 5
    window-seconds: 60

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs